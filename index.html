<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e0c" />
    <meta name="description" content="Sablewood — 朽ちた森の生存RPG。潜り、稼ぎ、強くなれ。" />
    <title>Sablewood — サブルウッド</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f0d'/%3E%3Cpath d='M16 4l3 8h5l-4 5 2 8-6-4-6 4 2-8-4-5h5z' fill='%23d9a441'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="ゲーム画面"></canvas>
      <div id="grain" aria-hidden="true"></div>
      <div id="vignette" aria-hidden="true"></div>

      <!-- HUD -->
      <header id="hud" class="hidden">
        <div class="hud-left">
          <div class="portrait" id="portrait"></div>
          <div class="vitals">
            <div class="name-row">
              <span id="hud-name">旅人</span>
              <span class="lvl" id="hud-level">Lv.1</span>
            </div>
            <div class="bar bar-hp" title="体力">
              <div class="fill" id="bar-hp"></div>
              <span class="bar-text" id="text-hp">20 / 20</span>
            </div>
            <div class="bar bar-sp" title="気力">
              <div class="fill" id="bar-sp"></div>
              <span class="bar-text" id="text-sp">5 / 5</span>
            </div>
            <div class="bar bar-xp" title="経験値">
              <div class="fill" id="bar-xp"></div>
              <span class="bar-text" id="text-xp">0 / 10</span>
            </div>
          </div>
        </div>
        <div class="hud-right">
          <div class="chip" id="hud-place"><span class="k">場所</span><span class="v" id="place-name">ソーンベリ村</span></div>
          <div class="chip" id="hud-day"><span class="k">日</span><span class="v" id="day-text">1日目 朝</span></div>
          <div class="chip" id="hud-gold"><span class="k">金</span><span class="v" id="gold-text">0</span></div>
        </div>
        <canvas id="minimap" width="132" height="132"></canvas>
      </header>

      <!-- message log -->
      <div id="log" class="hidden" aria-live="polite"></div>

      <!-- skill bar -->
      <div id="skillbar" class="hidden"></div>

      <!-- statuses -->
      <div id="statuses" class="hidden"></div>

      <!-- floating prompt -->
      <div id="prompt" class="hidden"></div>

      <!-- toasts -->
      <div id="toasts"></div>

      <!-- dialog -->
      <div id="dialog" class="hidden">
        <div class="dialog-portrait" id="dialog-portrait"></div>
        <div class="dialog-body">
          <div class="dialog-name" id="dialog-name"></div>
          <p class="dialog-text" id="dialog-text"></p>
          <div class="dialog-options" id="dialog-options"></div>
        </div>
      </div>

      <!-- modal screens -->
      <div id="screen" class="hidden" role="dialog" aria-modal="true">
        <div class="panel" id="panel"></div>
      </div>

      <!-- title -->
      <div id="title">
        <div class="title-fog"></div>
        <div class="title-inner">
          <p class="title-kicker">a survival RPG of the hollowed wood</p>
          <h1>Sablewood</h1>
          <p class="title-sub">サブルウッド — 朽ちた森の生存記</p>
          <div class="title-menu" id="title-menu"></div>
          <p class="title-foot"><span id="version-label">v0.9.0</span> ・ 操作: WASD/矢印 移動 ・ E 調べる ・ I 持ち物</p>
        </div>
      </div>

      <!-- loading -->
      <div id="boot">
        <div class="boot-mark">✦</div>
        <div class="boot-text">森を生成しています…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
